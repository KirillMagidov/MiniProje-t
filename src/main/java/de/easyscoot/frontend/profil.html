<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profil</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --beige:    #a9a799;
            --dark:     #3a3830;
            --cream:    #f5f3ef;
            --white:    #ffffff;
            --red:      #c0392b;
            --text:     #2c2b27;
            --muted:    #8a8880;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--cream);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        /* ── Hintergrund-Blob ── */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                    radial-gradient(ellipse 60% 50% at 10% 20%, rgba(169,167,153,0.25) 0%, transparent 70%),
                    radial-gradient(ellipse 50% 40% at 90% 80%, rgba(192,57,43,0.07) 0%, transparent 60%);
            pointer-events: none;
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 1;
            display: grid;
            grid-template-columns: 340px 1fr;
            width: 100%;
            max-width: 900px;
            min-height: 560px;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: 0 32px 80px rgba(58,56,48,0.18), 0 2px 8px rgba(58,56,48,0.08);
        }

        /* ── Linke Seite ── */
        .left {
            background: var(--beige);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 36px;
            gap: 20px;
            position: relative;
        }

        .left::after {
            content: '·';
            position: absolute;
            top: 36px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--red);
            font-size: 28px;
            line-height: 1;
        }

        .avatar-wrap {
            position: relative;
        }

        .avatar {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: rgba(255,255,255,0.18);
            border: 2px solid rgba(255,255,255,0.35);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            font-weight: 500;
            color: #fff;
            letter-spacing: 0.02em;
        }

        .avatar-edit {
            position: absolute;
            bottom: 2px;
            right: 2px;
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: var(--red);
            border: 2px solid var(--beige);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #fff;
            font-size: 12px;
            transition: background 0.15s;
        }
        .avatar-edit:hover { background: #a93226; }

        .left-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 26px;
            font-weight: 400;
            color: #fff;
            letter-spacing: 0.02em;
            text-align: center;
        }

        .badge {
            font-size: 10px;
            font-weight: 500;
            color: var(--red);
            background: rgba(255,255,255,0.18);
            border: 0.5px solid rgba(255,255,255,0.3);
            border-radius: 20px;
            padding: 3px 12px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .left-stats {
            display: flex;
            gap: 28px;
            margin-top: 8px;
        }
        .stat { text-align: center; }
        .stat-num {
            font-family: 'Cormorant Garamond', serif;
            font-size: 22px;
            font-weight: 500;
            color: #fff;
            line-height: 1;
        }
        .stat-label {
            font-size: 10px;
            color: rgba(255,255,255,0.6);
            margin-top: 3px;
            text-transform: uppercase;
            letter-spacing: 0.07em;
        }

        .left-divider {
            width: 40px;
            height: 0.5px;
            background: rgba(255,255,255,0.3);
        }

        .left-btn {
            width: 100%;
            padding: 11px;
            border-radius: 40px;
            border: 1.5px solid rgba(255,255,255,0.55);
            background: transparent;
            color: #fff;
            font-family: 'DM Sans', sans-serif;
            font-size: 11px;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .left-btn:hover { background: rgba(255,255,255,0.12); }
        .left-btn.danger { border-color: rgba(192,57,43,0.5); color: rgba(255,255,255,0.75); }
        .left-btn.danger:hover { background: rgba(192,57,43,0.15); }

        /* ── Rechte Seite ── */
        .right {
            background: var(--white);
            padding: 48px 44px;
            display: flex;
            flex-direction: column;
            gap: 32px;
            overflow-y: auto;
        }

        .right-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            font-weight: 400;
            color: var(--text);
            letter-spacing: 0.01em;
        }

        .section-label {
            font-size: 10px;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 12px;
        }

        .fields { display: flex; flex-direction: column; gap: 12px; }

        .field {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .field label {
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 0.05em;
        }

        .field input {
            background: var(--cream);
            border: 0.5px solid #dddbd6;
            border-radius: 8px;
            padding: 11px 14px;
            font-size: 13px;
            font-family: 'DM Sans', sans-serif;
            color: var(--text);
            outline: none;
            transition: border-color 0.15s;
        }
        .field input:focus { border-color: var(--beige); }
        .field input::placeholder { color: #bbb; }
        .field input[readonly] {
            color: var(--muted);
            cursor: default;
        }

        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .save-btn {
            width: 100%;
            padding: 13px;
            background: var(--beige);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-family: 'DM Sans', sans-serif;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            cursor: pointer;
            transition: background 0.15s;
        }
        .save-btn:hover { background: #989689; }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 12px;
            color: var(--muted);
            text-decoration: none;
            cursor: pointer;
            transition: color 0.15s;
            margin-bottom: -16px;
        }
        .back-link:hover { color: var(--text); }
        .back-link i { font-size: 15px; }
        .left-btn.delete { border-color: rgba(192,57,43,0.5); color: rgba(255,80,60,0.85); margin-top: 4px; }
        .left-btn.delete:hover { background: rgba(192,57,43,0.18); }

        /* readonly-look wenn gesperrt */
        .field input[readonly] { color: var(--muted); cursor: default; }
        .field input:not([readonly]) {
            background: #fff;
            border-color: var(--beige);
            color: var(--text);
        }
    </style>
</head>
<body>

<div class="card">

    <!-- Linke Seite -->
    <div class="left">
        <div class="avatar-wrap">
            <div class="avatar">MM</div>
            <div class="avatar-edit"><i class="ti ti-pencil"></i></div>
        </div>
        <p class="left-name">MaxMustermann</p>
        <span class="badge">Premium</span>

        <div class="left-divider"></div>

        <button class="left-btn" id="editBtn" onclick="toggleEdit()">Änderung eingeben</button>
        <button class="left-btn" onclick="window.history.back()">← Zurück zur Karte</button>
        <button class="left-btn danger">Logout</button>
        <button class="left-btn delete" onclick="confirmDelete()">Konto löschen</button>
    </div>

    <!-- Rechte Seite -->
    <div class="right">
        <a class="back-link" onclick="window.history.back()">
            <i class="ti ti-arrow-left"></i> Zurück
        </a>

        <p class="right-title">Mein Profil</p>

        <div>
            <p class="section-label">Persönliche Daten</p>
            <div class="fields">
                <div class="two-col">
                    <div class="field">
                        <label>Vorname</label>
                        <input type="text" value="Max" readonly />
                    </div>
                    <div class="field">
                        <label>Name</label>
                        <input type="text" value="Mustermann" readonly />
                    </div>
                </div>
                <div class="field">
                    <label>E-Mail</label>
                    <input type="email" value="max@mustermann.com" readonly />
                </div>
                <div class="field">
                    <label>Passwort</label>
                    <input type="password" value="geheim123" readonly />
                </div>
            </div>
        </div>

        <div>
            <p class="section-label">Adresse</p>
            <div class="fields">
                <div class="two-col">
                    <div class="field">
                        <label>Straße</label>
                        <input type="text" value="Musterstraße" readonly />
                    </div>
                    <div class="field">
                        <label>Hausnummer</label>
                        <input type="text" value="12" readonly />
                    </div>
                </div>
                <div class="two-col">
                    <div class="field">
                        <label>Postleitzahl</label>
                        <input type="text" value="30159" readonly />
                    </div>
                    <div class="field">
                        <label>Ort</label>
                        <input type="text" value="Hannover" readonly />
                    </div>
                </div>
            </div>
        </div>

        <button class="save-btn" id="saveBtn" style="display:none;">Änderungen speichern</button>
    </div>

</div>

<script>
    let editing = false;

    function toggleEdit() {
        editing = !editing;
        const inputs = document.querySelectorAll('.right input');
        const btn = document.getElementById('editBtn');
        const saveBtn = document.getElementById('saveBtn');

        inputs.forEach(input => {
            if (editing) {
                input.removeAttribute('readonly');
            } else {
                input.setAttribute('readonly', true);
            }
        });

        btn.textContent = editing ? 'Abbrechen' : 'Änderung eingeben';
        btn.style.borderColor = editing ? 'rgba(192,57,43,0.5)' : '';
        btn.style.color = editing ? 'rgba(255,80,60,0.85)' : '';
        saveBtn.style.display = editing ? 'block' : 'none';
    }

    function confirmDelete() {
        if (confirm('Möchtest du dein Konto wirklich löschen? Diese Aktion kann nicht rückgängig gemacht werden.')) {
            alert('Konto wurde gelöscht.');
        }
    }
</script>
</body>
</html>
