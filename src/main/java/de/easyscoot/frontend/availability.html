<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bitlana – Map Layout</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: #a9a799;
            color: #f0ede8;
            height: 100vh;
            overflow: hidden;
        }

        #map {
            position: absolute;
            inset: 0;
            z-index: 0;
        }

        /* ── Linke Icon-Leiste ── */
        .left-bar {
            position: absolute;
            left: 0; top: 0; bottom: 0;
            width: 58px;
            background: rgba(30, 28, 25, 0.92);
            backdrop-filter: blur(10px);
            border-right: 0.5px solid #3a3830;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 16px 0;
            gap: 8px;
            z-index: 100;
        }

        .nav-logo {
            font-size: 13px;
            font-weight: 700;
            color: #f0ede8;
            letter-spacing: 0.04em;
            margin-bottom: 8px;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: rotate(180deg);
            cursor: pointer;
        }

        .nav-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #7a7669;
            font-size: 20px;
            cursor: pointer;
            transition: background 0.15s, color 0.15s;
            text-decoration: none;
            border: none;
            background: transparent;
        }
        .nav-icon.active {
            background: rgba(169, 167, 153, 0.2);
            color: #f0ede8;
        }
        .nav-icon:hover {
            background: rgba(169, 167, 153, 0.12);
            color: #d4d0c8;
        }
        .nav-spacer { flex: 1; }
        .nav-icon.logout { color: #c0392b; }
        .nav-icon.logout:hover { background: rgba(192, 57, 43, 0.15); color: #e74c3c; }

        /* ── Home-Panel (fly-out) ── */
        .home-panel {
            position: absolute;
            left: 58px; top: 0; bottom: 0;
            width: 220px;
            background: rgba(28, 26, 23, 0.93);
            backdrop-filter: blur(14px);
            border-right: 0.5px solid #3a3830;
            display: flex;
            flex-direction: column;
            padding: 16px 12px;
            gap: 6px;
            z-index: 90;
            transform: translateX(-220px);
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .home-panel.open {
            transform: translateX(0);
        }

        .panel-title {
            font-size: 10px;
            color: #6b6960;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            padding: 0 4px;
            margin-bottom: 6px;
        }

        .profile-card {
            background: rgba(169, 167, 153, 0.08);
            border: 0.5px solid #3a3830;
            border-radius: 10px;
            padding: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: background 0.15s;
            margin-bottom: 6px;
        }
        .profile-card:hover { background: rgba(169, 167, 153, 0.13); }

        .avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: rgba(169, 167, 153, 0.15);
            border: 1.5px solid rgba(169, 167, 153, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 600;
            color: #f0ede8;
            flex-shrink: 0;
        }

        .profile-name {
            font-size: 13px;
            font-weight: 600;
            color: #f0ede8;
        }
        .profile-badge {
            display: inline-block;
            font-size: 9px;
            font-weight: 600;
            color: #c0392b;
            background: rgba(192, 57, 43, 0.12);
            border: 0.5px solid rgba(192, 57, 43, 0.3);
            border-radius: 4px;
            padding: 1px 5px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-top: 2px;
        }

        .divider {
            height: 0.5px;
            background: #3a3830;
            margin: 4px 0;
        }

        .menu-btn {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 8px;
            color: #7a7669;
            font-size: 13px;
            cursor: pointer;
            border: none;
            background: transparent;
            width: 100%;
            text-align: left;
            transition: background 0.15s, color 0.15s;
        }
        .menu-btn:hover {
            background: rgba(169, 167, 153, 0.08);
            color: #d4d0c8;
        }
        .menu-btn i { font-size: 16px; }
        .menu-btn.active { color: #f0ede8; }
        .menu-btn.danger { color: #c0392b; }
        .menu-btn.danger:hover { background: rgba(192, 57, 43, 0.12); color: #e74c3c; }

        .bitl-display {
            margin-top: auto;
            background: rgba(169, 167, 153, 0.08);
            border: 0.5px solid #3a3830;
            border-radius: 10px;
            padding: 10px 12px;
        }
        .bitl-label { font-size: 10px; color: #6b6960; margin-bottom: 2px; }
        .bitl-amount { font-size: 20px; font-weight: 700; color: #f0ede8; }

        /* Schwebende Suchleiste oben rechts */
        .search-float {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 260px;
            background: rgba(28, 26, 23, 0.92);
            backdrop-filter: blur(14px);
            border: 0.5px solid #3a3830;
            border-radius: 12px;
            padding: 10px 14px;
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .search-float i { font-size: 16px; color: #6b6960; flex-shrink: 0; }
        .search-float input {
            background: transparent;
            border: none;
            outline: none;
            color: #f0ede8;
            font-size: 13px;
            flex: 1;
            font-family: inherit;
        }
        .search-float input::placeholder { color: #5a5850; }

        /* Location Button unten Mitte */
        .location-btn {
            position: absolute;
            bottom: 16px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(28, 26, 23, 0.92);
            border: 0.5px solid #3a3830;
            border-radius: 20px;
            padding: 7px 18px;
            font-size: 12px;
            color: #d4d0c8;
            z-index: 100;
            white-space: nowrap;
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
            font-family: inherit;
        }
        .location-btn:hover { background: rgba(169,167,153,0.15); border-color: #5a5850; }
        .location-btn i { font-size: 14px; color: #c0392b; }

        /* Location Popup  */
        .location-popup {
            position: absolute;
            bottom: 52px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(28, 26, 23, 0.97);
            border: 0.5px solid #3a3830;
            border-radius: 14px;
            padding: 14px 16px;
            z-index: 101;
            width: 300px;
            backdrop-filter: blur(16px);
            display: none;
            flex-direction: column;
            gap: 10px;
        }
        .location-popup.open { display: flex; }
        .location-popup label { font-size: 10px; color: #6b6960; text-transform: uppercase; letter-spacing: 0.08em; }
        .location-popup input {
            background: rgba(169,167,153,0.08);
            border: 0.5px solid #3a3830;
            border-radius: 8px;
            padding: 8px 12px;
            color: #f0ede8;
            font-size: 13px;
            font-family: inherit;
            outline: none;
            width: 100%;
            transition: border-color 0.15s;
        }
        .location-popup input:focus { border-color: #a9a799; }
        .location-popup input::placeholder { color: #5a5850; }
        .location-go-btn {
            background: #c0392b;
            border: none;
            border-radius: 8px;
            padding: 8px;
            color: #fff;
            font-size: 13px;
            font-family: inherit;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.15s;
        }
        .location-go-btn:hover { background: #a93226; }
        .location-error { font-size: 11px; color: #c0392b; display: none; }

        /* Leaflet Tiles gedimmt für warmes dunkles Theme */
        .leaflet-tile {
            filter: brightness(0.55) sepia(0.3) saturate(0.6);
        }

        .leaflet-control-zoom a {
            background: rgba(28,26,23,0.92) !important;
            color: #f0ede8 !important;
            border-color: #3a3830 !important;
        }
        .leaflet-control-zoom a:hover {
            background: rgba(169,167,153,0.15) !important;
        }
    </style>
</head>
<body>

<!-- Leaflet Karte -->
<div id="map"></div>

<!-- Linke Icon-Leiste -->
<div class="left-bar">
    <span class="nav-logo">ES</span>
    <button class="nav-icon active" id="btn-home" title="Home" onclick="togglePanel('home')">
        <i class="ti ti-home"></i>
    </button>
    <button class="nav-icon" id="btn-bell" title="Benachrichtigungen" onclick="togglePanel('bell')">
        <i class="ti ti-bell"></i>
    </button>
    <div class="nav-spacer"></div>
    <button class="nav-icon logout" title="Logout">
        <i class="ti ti-logout"></i>
    </button>
</div>

<!-- Drauf drücken dann kommt fenster raus -->
<div class="home-panel" id="home-panel">
    <p class="panel-title">Home</p>

    <div class="profile-card">
        <div class="avatar">MM</div>
        <div>
            <p class="profile-name">MaxMustermann</p>
            <span class="profile-badge">Tester</span>
        </div>
    </div>

    <button class="menu-btn active"><i class="ti ti-user"></i> Profil</button>
    <button class="menu-btn"><i class="ti ti-settings"></i> Einstellungen</button>

    <div class="divider"></div>
    <div class="divider"></div>

    <button class="menu-btn danger"><i class="ti ti-logout"></i> Logout</button>

</div>

<!-- Schwebende Suchleiste oben rechts -->
<div class="search-float">
    <i class="ti ti-search"></i>
    <input type="text" placeholder="Suchen..." />
</div>

<!-- Location Popup -->
<div class="location-popup" id="location-popup">
    <label>Ort eingeben</label>
    <input type="text" id="location-input" placeholder="z.B. Berlin, Hamburg, München..." />
    <span class="location-error" id="location-error">Ort nicht gefunden. Bitte nochmal versuchen.</span>
    <button class="location-go-btn" onclick="goToLocation()">
        <i class="ti ti-map-pin"></i> Zur Position springen
    </button>
</div>

<!-- Location Button -->
<button class="location-btn" id="location-btn" onclick="toggleLocationPopup()">
    <i class="ti ti-map-pin"></i>
    <span id="location-label">Hannover, Deutschland</span>
</button>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
    const map = L.map('map', { zoomControl: false }).setView([52.3759, 9.7320], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    L.control.zoom({ position: 'bottomright' }).addTo(map);

    let activePanel = null;

    function togglePanel(name) {
        const panel = document.getElementById('home-panel');
        const btn = document.getElementById('btn-' + name);
        const allBtns = document.querySelectorAll('.nav-icon');

        if (activePanel === name) {
            panel.classList.remove('open');
            btn.classList.remove('active');
            activePanel = null;
        } else {
            panel.classList.add('open');
            allBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            activePanel = name;
        }

        setTimeout(() => map.invalidateSize(), 280);
    }

    // Location Popup
    function toggleLocationPopup() {
        const popup = document.getElementById('location-popup');
        popup.classList.toggle('open');
        if (popup.classList.contains('open')) {
            setTimeout(() => document.getElementById('location-input').focus(), 50);
        }
    }

    // Enter-Taste im Input
    document.getElementById('location-input').addEventListener('keydown', function(e) {
        if (e.key === 'Enter') goToLocation();
    });

    // Klick außerhalb schließt Popup
    document.addEventListener('click', function(e) {
        const popup = document.getElementById('location-popup');
        const btn = document.getElementById('location-btn');
        if (!popup.contains(e.target) && !btn.contains(e.target)) {
            popup.classList.remove('open');
        }
    });

    async function goToLocation() {
        const input = document.getElementById('location-input').value.trim();
        const error = document.getElementById('location-error');
        const label = document.getElementById('location-label');
        error.style.display = 'none';

        if (!input) return;

        try {
            const res = await fetch(`https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(input)}&format=json&limit=1`);
            const data = await res.json();

            if (!data.length) {
                error.style.display = 'block';
                return;
            }

            const { lat, lon, display_name } = data[0];
            map.flyTo([parseFloat(lat), parseFloat(lon)], 13, { duration: 1.2 });

            // Kurzname: erste zwei Teile des display_name
            const shortName = display_name.split(',').slice(0, 2).join(',').trim();
            label.textContent = shortName;

            document.getElementById('location-popup').classList.remove('open');
            document.getElementById('location-input').value = '';
        } catch {
            error.style.display = 'block';
        }
    }
</script>
</body>
</html>
