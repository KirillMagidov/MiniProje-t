<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EasyScoot – Anmelden</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles/auth.css">
</head>
<body>

<div class="auth-wrapper">

    <!-- Sliding Panel -->
    <div class="slider" id="slider">
        <div class="slider__logo">EasyScoot</div>

        <div id="slider-to-register">
            <p class="slider__sub">Noch kein Konto?<br>Registriere dich jetzt und starte deine erste Fahrt.</p>
            <button class="slider__btn" id="btn-show-register">Registrieren</button>
        </div>

        <div id="slider-to-login" style="display:none;">
            <p class="slider__sub">Bereits registriert?<br>Melde dich an und fahr los.</p>
            <button class="slider__btn" id="btn-show-login">Anmelden</button>
        </div>

        <button class="slider__btn" id="btn-back-home" style="margin-top: 50px;">Zurück zur Startseite</button>
    </div>

    <!-- Login Formular -->
    <div class="form-panel panel-login" id="panel-login">
        <h2>Willkommen zurück</h2>
        <form id="loginForm" style="width:100%;">
            <div class="input-group">
                <input type="email" id="LoginEmail" placeholder="E-Mail" required>
            </div>
            <div class="input-group">
                <input type="password" id="LoginPassword" placeholder="Passwort" required>
            </div>
            <button type="submit" class="btn-submit">Anmelden</button>
        </form>
    </div>

    <!-- Register Formular -->
    <div class="form-panel panel-register" id="panel-register">
        <h2>Konto erstellen</h2>
        <div class="form-scroll">
            <form id="accountForm" style="width:100%;">
                <!-- Vorname + Nachname -->
                <div class="input-row">
                    <div class="input-group">
                        <input type="text" id="ForeName" placeholder="Vorname" required>
                    </div>
                    <div class="input-group">
                        <input type="text" id="Name" placeholder="Nachname" required>
                    </div>
                </div>
                <!-- Straße + Nummer -->
                <div class="input-row">
                    <div class="input-group">
                        <input type="text" id="Street" placeholder="Straße" required>
                    </div>
                    <div class="input-group" style="max-width:120px;">
                        <input type="number" id="StreetNumber" placeholder="Nr." required>
                    </div>
                </div>
                <!-- PLZ + Ort -->
                <div class="input-row">
                    <div class="input-group" style="max-width:140px;">
                        <input type="text" id="Plz" placeholder="PLZ" required>
                    </div>
                    <div class="input-group">
                        <input type="text" id="Location" placeholder="Ort" required>
                    </div>
                </div>
                <!-- E-Mail -->
                <div class="input-group">
                    <input type="email" id="Email" placeholder="E-Mail" required>
                </div>
                <!-- Passwort -->
                <div class="input-group">
                    <input type="password" id="Password" placeholder="Passwort" required>
                </div>
                <p class="password-hint">Mindestens 8 Zeichen, inkl. Groß-, Kleinbuchstaben und Zahlen.</p>
                <!-- Passwort wiederholen -->
                <div class="input-group">
                    <input type="password" id="RepeatPassword" placeholder="Passwort wiederholen" required>
                </div>
                <button type="submit" class="btn-submit">Konto erstellen</button>
            </form>
        </div>
    </div>

</div>

<script src="../scripts/auth.js"></script>

</body>
</html>
