<!DOCTYPE html>
<html>
<head>
    <!-- CSS einbinden -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1 class="title1">Konto Erstellen</h1>

<img src="LogInEasyScoot.png" typeof="Image">

<form id="accountForm">


    <div class="form-wrapper">

        <!-- LINKS -->
        <div class="form-left">
            <input type="text" id="ForeName" placeholder="ForeName" required>
            <input type="text" id="Name" placeholder="Name" required>
            <input type="text" id="Street" placeholder="Street" required>
            <input type="number" id="StreetNumber" placeholder="StreetNumber" required>
            <input type="text" id="Location" placeholder="Location" required>
            <input type="text" id="Plz" placeholder="PLZ" required>
            <input type="email" id="Email" placeholder="Email" required>
        </div>

        <!-- RECHTS -->
        <div class="form-right">
            <input type="password" id="Password" placeholder="Password" required>
            <input type="password" id="RepeatPassword" placeholder="Repeat Password" required>
        </div>

    </div>

    <!-- BUTTON -->
    <button class="btn btn4" id="btnCreateAccount" type="submit">Konto erstellen</button>



</form>



<!-- JavaScript einbinden -->
<script src="script.js"></script>

</body>
</html>
